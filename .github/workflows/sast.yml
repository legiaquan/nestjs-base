name: SAST

on:
  pull_request:
  push:
    branches: ["main", "develop"]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          output: codeql-results

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fail if CodeQL found error-level findings
        run: |
          if [ -f codeql-results/javascript.sarif ]; then
            ERR_COUNT=$(jq '[..|objects|select(has("level") and .level=="error")] | length' codeql-results/javascript.sarif)
            echo "Found $ERR_COUNT error-level findings in CodeQL SARIF"
            if [ "$ERR_COUNT" -gt 0 ]; then
              exit 1
            fi
          else
            echo "CodeQL SARIF not found at codeql-results/javascript.sarif";
          fi

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/javascript.sarif

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep (fail on High/Critical)
        run: |
          semgrep scan \
            --config ./security/semgrep/config.yml \
            --baseline-ref origin/main \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --sarif --output semgrep.sarif \
            --severity ERROR \
            --error

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep report artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif


